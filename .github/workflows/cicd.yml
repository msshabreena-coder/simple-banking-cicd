
name: Simple Banking CI-CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build-deploy:
    runs-on: self-hosted

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/simple-banking
      IMAGE_TAG: build-${{ github.run_number }}

    steps:
      - name: Stage 1 - Checkout Source Code
        uses: actions/checkout@v4

      - name: Stage 2 - Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage 3 - Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Stage 3 - Run Automated Tests
        run: python -m unittest -v

      - name: Stage 4 - Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Stage 4 - Build Docker Image
        run: docker build -t "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" .

      - name: Stage 4 - Push Docker Image
        run: docker push "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Stage 5 - Configure Kubernetes Access
        shell: pwsh
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KUBE_CONFIG_B64)) {
            throw "KUBE_CONFIG secret is missing."
          }

          $configDir = Join-Path $HOME ".kube"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          $configPath = Join-Path $configDir "config"
          $bytes = [Convert]::FromBase64String($env:KUBE_CONFIG_B64)
          [IO.File]::WriteAllBytes($configPath, $bytes)
          "KUBECONFIG=$configPath" >> $env:GITHUB_ENV

      - name: Stage 5 - Deploy to Kubernetes
        shell: pwsh
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

          kubectl set image deployment/simple-banking banking="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          kubectl rollout status deployment/simple-banking --timeout=180s

          kubectl get deployment simple-banking
          kubectl get pods -l app=simple-banking
          kubectl get service simple-banking-service
