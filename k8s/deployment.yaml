apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-banking
  template:
    metadata:
      labels:
        app: simple-banking
    spec:
      containers:
        - name: banking
          image: shabbu2007/simple-banking:bootstrap
          imagePullPolicy: Always
          stdin: true
          tty: true
